<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Admin · YehMee Beauty Lounge</title>
  <meta name="description" content="" />
  <link rel="icon" type="image/png" href="/images/brand/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Merriweather:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700&display=swap" />
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body data-page="admin">
  <div id="site-header"></div>

  <div class="band"><h1 data-i18n="adminPage.title">Fotos verwalten</h1></div>
  <p class="alert alert--info" id="admin-status" role="status" hidden></p>

  <main class="admin">
    <p class="admin__intro" data-i18n="adminPage.sub"></p>

    <nav class="admin__tabs" aria-label="Admin">
      <a href="#galerie" data-i18n="adminPage.gallery">Galerie</a>
      <a href="#services" data-i18n="adminPage.services">Service-Fotos</a>
      <a href="#gutscheine" data-i18n="adminPage.vouchers">Gutscheine</a>
    </nav>

    <section id="galerie" class="admin__block">
      <h2 data-i18n="adminPage.gallery">Galerie</h2>
      <p class="muted" data-i18n="adminPage.builtInNote"></p>
      <div id="gallery-admin"><p data-i18n="common.loading">Wird geladen…</p></div>
    </section>

    <section id="services" class="admin__block">
      <h2 data-i18n="adminPage.services">Service-Fotos</h2>
      <div id="services-admin"><p data-i18n="common.loading">Wird geladen…</p></div>
    </section>

    <section id="gutscheine" class="admin__block">
      <h2 data-i18n="adminPage.vouchers">Gutscheine</h2>
      <p class="muted" data-i18n="adminPage.vouchersNote"></p>
      <form id="voucher-form" class="admin__voucher-form" novalidate>
        <div class="field"><label for="voucher-amount" data-i18n="adminPage.voucherAmount">Betrag in €</label><input class="plain" id="voucher-amount" name="amountEur" type="number" min="1" max="1000" step="0.01" required /></div>
        <div class="field"><label for="voucher-code" data-i18n="adminPage.voucherCode">Code</label><input class="plain" id="voucher-code" name="code" maxlength="32" autocomplete="off" /></div>
        <div class="field"><label for="voucher-note" data-i18n="adminPage.voucherNote">Notiz</label><input class="plain" id="voucher-note" name="note" maxlength="200" /></div>
        <button class="btn" type="submit" data-i18n="adminPage.voucherAdd">Gutschein anlegen</button>
      </form>
      <div id="vouchers-admin"><p data-i18n="common.loading">Wird geladen…</p></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="/js/layout.js" type="module"></script>
  <script src="/admin/admin.js" type="module"></script>
</body>
</html>
